name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Unpack project
        run: |
          unzip -o '*.zip'
          cd BountyAssassin
          sed -i -E 's#<maven.compiler.release>[0-9]+#<maven.compiler.release>25#' pom.xml
          sed -i -E 's#1\.21\.[0-9]+-R0\.1-SNAPSHOT#1.21.11-R0.1-SNAPSHOT#' pom.xml
      - run: mvn -B clean package
        working-directory: BountyAssassin
      - uses: actions/upload-artifact@v4
        with:
          name: BountyAssassin
          path: BountyAssassin/target/BountyAssassin.jar
